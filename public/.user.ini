; Cấu hình PHP cho hosting cPanel (PHP-FPM / LiteSpeed đọc file này; XAMPP bỏ qua)
; Không hiện lỗi PHP ra trình duyệt (lộ đường dẫn máy chủ) – lỗi vẫn được ghi vào error log của hosting
display_errors = Off
log_errors = On
expose_php = Off

; Ảnh minh chứng: tối đa 3 ảnh x 5MB mỗi báo cáo
upload_max_filesize = 6M
post_max_size = 20M
max_file_uploads = 10

; Cookie phiên
session.cookie_httponly = 1
session.use_strict_mode = 1
